name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python build.py --check
      # The host and AI types are local drafts until the AI plugin API exists.
      - run: pip install pytest PySide6
      - run: python -m pytest -q
